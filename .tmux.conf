# Set prefix to Ctrl-a (optional, feels more natural)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable mouse mode (for scrolling and pane resize)
set -g mouse on

# Allow using tmux scrollback buffer with Shift + PgUp or mouse wheel
setw -g mode-keys vi
bind -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X scroll-down

# Easy splitting
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind w kill-pane

# Make scrollback longer (default is only 2k lines)
set -g history-limit 100000

# Enable true color (for modern terminals)
set -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Improve copy-paste integration on macOS with pbcopy/pbpaste
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Reload tmux config with: Ctrl+a r
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"
